<!doctype html><html lang="en"><meta charset="utf-8"><title>Purchased Walla font check</title><link rel="stylesheet" href="../css/fonts.css?v=8"><link rel="stylesheet" href="../css/japanese-font.css?v=3"><style>body{background:#faf0e6;color:#320505;padding:32px;font:20px/1.5 'SC Walla',Arial,sans-serif}p{font-size:32px}.medium{font-weight:500}.bold{font-weight:700}pre{font:14px/1.5 monospace}</style><body><p>Regular — Familiar Characters, 0123456789</p><p class="medium">Medium — Clear ideas, with character.</p><p class="bold">Bold — House of familiar things.</p><pre id="result">Checking purchased fonts…</pre><script>
(async()=>{try{await Promise.all([400,500,700].map(weight=>document.fonts.load(`${weight} 32px "SC Walla"`)));await document.fonts.ready;document.querySelector('#result').textContent=JSON.stringify([...document.fonts].filter(face=>face.family.includes('Walla')).map(face=>({family:face.family,weight:face.weight,status:face.status})),null,2)}catch(error){document.querySelector('#result').textContent='FAIL: '+error.message}})();
</script></body></html>
