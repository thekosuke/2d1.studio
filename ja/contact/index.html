<main id="main" class="contact-page-main">
    <section class="contact-page-form" id="contact" aria-labelledby="contact-title">
      <header class="contact-page-heading">
          <h1 class="contact-title" id="contact-title">まずはお話ししましょう</h1>
          <p class="contact-intro">あなたのことや、考えていることを少し教えてください。</p>
      </header>
      <div class="contact-sheet">
        <div class="contact-head">
          <span class="contact-eyes" aria-hidden="true"><i></i><i></i></span>
          
        </div>
        <form onsubmit="return false" class="contact-form" id="contact-form" novalidate>
          <div class="field">
            <label class="field-label" for="c-name">お名前<span class="req" aria-hidden="true"></span></label>
            <input class="field-input" id="c-name" name="name" type="text" autocomplete="name" required maxlength="120">
          </div>
          <div class="field">
            <label class="field-label" for="c-email">メールアドレス<span class="req" aria-hidden="true"></span></label>
            <input class="field-input" id="c-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required maxlength="254">
          </div>
          <div class="field">
            <label class="field-label" for="c-company">会社名<span class="opt">任意</span></label>
            <input class="field-input" id="c-company" name="company" type="text" autocomplete="organization" maxlength="120">
          </div>
          <fieldset class="field field-choice">
            <legend class="field-label">カテゴリー<span class="req" aria-hidden="true"></span></legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="category" value="New Business" required><span>お仕事のご相談</span></label>
              <label class="chip"><input type="radio" name="category" value="Media Inquiry"><span>取材・メディアのお問い合わせ</span></label>
              <label class="chip"><input type="radio" name="category" value="Collaboration"><span>コラボレーション</span></label>
              <label class="chip"><input type="radio" name="category" value="Other"><span>その他</span></label>
            </div>
          </fieldset>
          <div class="field">
            <label class="field-label" for="c-message">メッセージ<span class="req" aria-hidden="true"></span><span class="count-chars" aria-hidden="true"><span id="c-count">0</span>/2000</span></label>
            <textarea class="field-input field-area" id="c-message" name="message" rows="3" required maxlength="2000" placeholder="どんなことをお考えですか？"></textarea>
          </div>
          <div class="field-trap" aria-hidden="true"><label for="c-website">ウェブサイト</label><input id="c-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <div class="contact-foot">
            <button class="contact-send intro-cta" type="submit" disabled><span class="send-label">送信する</span><span class="send-arrow pixel-arrow" aria-hidden="true"></span></button>
            <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
          </div>
        </form>
        <noscript><p class="contact-fallback">このフォームはまだ準備中のため、送信されていません。お問い合わせは<a href="https://temporal-sight-127.notion.site/966aab52301b4588a1c875bf81ac421a?pvs=105" target="_blank" rel="noopener noreferrer">Notionのお問い合わせフォーム<span class="sr-only">（新しいタブで開きます）</span></a>をご利用ください。</p></noscript>
        <div class="contact-done" hidden>
          <p class="contact-title contact-done-title" tabindex="-1">ありがとうございます<span class="done-name"></span>.</p>
          <p class="contact-intro">メッセージを受け取りました。5営業日以内にお返事します。</p>
          <button class="contact-send intro-cta" type="button" data-close><span class="send-label">閉じる</span></button>
        </div>
        <p class="contact-fallback" hidden>このフォームはまだ準備中のため、送信されていません。お問い合わせは<a href="https://temporal-sight-127.notion.site/966aab52301b4588a1c875bf81ac421a?pvs=105" target="_blank" rel="noopener noreferrer">Notionのお問い合わせフォーム<span class="sr-only">（新しいタブで開きます）</span></a>をご利用ください。</p>
      </div>
