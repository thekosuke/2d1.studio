<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Pixel by 2D1</title>
  <meta name="theme-color" content="#FAF0E6">
  <link rel="canonical" href="https://2d1.studio/ja/red-pixel/">
  <link rel="alternate" hreflang="en" href="https://2d1.studio/red-pixel/">
  <link rel="alternate" hreflang="ja" href="https://2d1.studio/ja/red-pixel/">
  <link rel="alternate" hreflang="x-default" href="https://2d1.studio/red-pixel/">
  <link rel="icon" href="../../img/brand/2d1-icon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" href="../../img/brand/2d1-icon.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="../../img/brand/2d1-icon.svg?v=2" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="../../img/brand/2d1-apple-touch.png?v=2" sizes="180x180">
  <link rel="stylesheet" href="../../css/fonts.css?v=7">
  <link rel="stylesheet" href="../../css/japanese-font.css?v=1">
  <link rel="stylesheet" href="../../css/red-pixel.css?v=4">
  <link rel="stylesheet" href="../../css/text-links.css?v=7">
</head>
<body>
  <main id="main" aria-label="Red Pixel Pong" tabindex="-1" aria-describedby="pixel-instructions">
    <button class="pixel-grab" type="button" aria-label="赤いピクセルをつかんで投げる" aria-describedby="pixel-instructions"><span class="red-pixel" aria-hidden="true"></span></button>
    <canvas class="pong-court" hidden aria-hidden="true"></canvas>
  </main>
  <p class="pixel-caption" translate="no">RED PIXEL</p>
  <p class="sr-only" id="pixel-instructions">ピクセルをつかんで投げるとPongが始まります。Enterでつかみ、もう一度Enterで投げることもできます。マウス、タッチ、上下矢印キーでパドルを操作します。クリックまたはタップで一時停止・再開、スペースで一時停止、Escapeで終了。先に5点取った方の勝ちです。</p>
  <details class="pixel-zoom"><summary translate="no">ZOOM</summary><span class="sr-only">赤いピクセルを24 × 24ピクセルに拡大しています。</span></details>
  <p class="pixel-prompt" hidden>ピクセルを投げてPONGをプレイ</p>
  <div class="pong-controls" hidden><button type="button" data-pong-exit>終了</button></div>
  <div class="pong-scoreboard" hidden aria-label="Pong スコアボード">
    <p class="pong-help" hidden>5点先取</p>
    <div class="pong-score"><span>あなた</span><strong data-score="0">0</strong></div>
    <div class="pong-score"><strong data-score="1">0</strong><span translate="no">2D1 BOT</span></div>
  </div>
  <div class="pong-message" hidden><p></p><button type="button">再開</button></div>
  <p class="sr-only" role="status" aria-live="polite" data-pong-status></p>
  <noscript><p class="pixel-prompt">PongをプレイするにはJavaScriptを有効にしてください。ZOOMはそのまま使えます。</p></noscript>
  <script src="../../js/pong-physics.js?v=2" defer></script>
  <script src="../../js/red-pixel.js?v=7" defer></script>
</body>
</html>
