<body>
  <main id="main" aria-label="Red Pixel ピンポン" tabindex="-1" aria-describedby="pixel-instructions">
    <button class="pixel-grab" type="button" aria-label="赤いピクセルをつかんで投げる" aria-describedby="pixel-instructions"><span class="red-pixel" aria-hidden="true"></span></button>
    <canvas class="pong-court" hidden aria-hidden="true"></canvas>
  </main>
  <p class="pixel-caption" translate="no">RED PIXEL</p>
  <p class="sr-only" id="pixel-instructions">ページをクリックするとピクセルが大きくなります。BIGGER で 4 段階に拡大し、SMALLER で縮小します。ピクセルをつかんで投げると Pong が始まります。Enter でつかみ、もう一度 Enter で投げることもできます。マウス、タッチ、上下矢印キーでパドルを操作します。クリックまたはタップで一時停止・再開、スペースで一時停止、Escape で終了。先に 3 点取った方の勝ちです。</p>
  <details class="pixel-zoom"><summary translate="no"><span class="pixel-bigger">BIGGER</span><span class="pixel-smaller">SMALLER</span></summary><span class="sr-only" aria-live="polite" data-pixel-size>赤いピクセルを 24 × 24 ピクセルに拡大しています。</span></details>
  <p class="pixel-prompt" hidden>ピクセルを投げて PONG をプレイ</p>
  <div class="pong-controls" hidden><button type="button" data-pong-exit>終了</button></div>
  <div class="pong-scoreboard" hidden aria-label="Pong スコアボード">
    <p class="pong-help" hidden>3 点先取</p>
    <div class="pong-score"><span>あなた </span><strong data-score="0">0</strong></div>
    <div class="pong-score"><strong data-score="1">0</strong><span translate="no">2D1 BOT</span></div>
  </div>
  <div class="pong-message" hidden><p></p><p class="pong-nickname" data-pong-nickname hidden></p><button type="button">再開</button></div>
  <p class="sr-only" role="status" aria-live="polite" data-pong-status></p>
  <noscript><p class="pixel-prompt">Pong をプレイするには JavaScript を有効にしてください。BIGGER はそのまま使えます。</p></noscript>
  <script src="../../js/pong-physics.js?v=2" defer></script>
  <script src="../../js/pong-nicknames.js?v=2" defer></script>
  <script src="../../js/red-pixel.js?v=17" defer></script>
</body>
